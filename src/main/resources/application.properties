# ==============================================
# DATABASE CONFIGURATION
# ==============================================
# Database Connection (keeping your existing settings)
spring.datasource.url=jdbc:mysql://localhost:3306/school_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================
# JPA/HIBERNATE SETTINGS
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================================
# SERVER CONFIGURATION
# ==============================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.context-path=/

# ==============================================
# APPLICATION NAME
# ==============================================
spring.application.name=admin-system

# ==============================================
# JWT (JSON WEB TOKEN) SECURITY
# ==============================================
# JWT Secret Key - Change this in production!
jwt.secret=zJVFJWq7Qxh8M2kN5sT9pLxR3vYcD6wEaB4uHnG1mK2yX8fA7cD9eF0gH1jK2l
# JWT Expiration in milliseconds (24 hours = 86400000)
jwt.expiration=86400000
# JWT Refresh Token Expiration (7 days = 604800000)
jwt.refresh-expiration=604800000

# ==============================================
# CORS (Cross-Origin Resource Sharing)
# ==============================================
# Allow React frontend (Vite default port 5173)
cors.allowed.origins=http://localhost:5173,http://localhost:3000
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=*
cors.allow.credentials=true

# ==============================================
# LOGGING
# ==============================================
logging.level.com.school.admin_system=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==============================================
# AI & ANALYTICS CONFIGURATION
# ==============================================
# AI Service Settings
ai.prediction.model.enabled=true
ai.dropout.threshold=40
ai.pass.threshold=50
ai.max.predictions=100

# ==============================================
# FILE UPLOAD CONFIGURATION (for receipts, etc.)
# ==============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ==============================================
# EMAIL CONFIGURATION (for account creation notifications)
# ==============================================
# Uncomment and configure if you want email notifications
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================================
# PERFORMANCE CONFIGURATION
# ==============================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================================
# DATA INITIALIZATION
# ==============================================
# Uncomment to automatically create default admin on startup
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql