# Development-specific settings

# Use H2 in-memory database for faster testing (optional - comment out MySQL if using)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# Or keep using MySQL with dev database
spring.datasource.url=jdbc:mysql://localhost:3306/school_db_dev?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# More detailed logging for development
logging.level.com.school.admin_system=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=TRACE

# Enable H2 console (if using H2)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Disable some security features for easier development
spring.security.debug=true

# JWT shorter expiration for testing (1 hour)
jwt.expiration=3600000

# Show SQL parameters for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE